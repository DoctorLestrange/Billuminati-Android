name: Tagged Release APK & AAB

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Versioned Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK 36.1 & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi

          set +o pipefail
          yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          set -o pipefail

          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "build-tools;36.0.0" \
            "platforms;android-36" \
            "platforms;android-36.1"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.1

      - name: Prepare Environment & Debug Signing Keystore
        run: |
          which gradle && gradle --version

          for required_file in settings.gradle.kts build.gradle.kts gradle.properties gradle/libs.versions.toml app/build.gradle.kts; do
            if [ ! -f "$required_file" ]; then
              echo "::error::Missing required Gradle file '$required_file' in this repository. Commit and push '$required_file' to GitHub."
              ls -la . gradle/ 2>&1 || true
              exit 1
            fi
          done

          [ -f .env.example ] || touch .env.example

          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi

          if [ ! -s debug.keystore ] || ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            rm -f debug.keystore
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Verify Tests & Lint
        run: |
          gradle :app:testDebugUnitTest --no-configuration-cache --console=plain
          gradle :app:lintDebug --no-configuration-cache --console=plain

      - name: Build Release APK (and AAB if signing secrets configured)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          RELEASE_TAG="${{ inputs.tag || github.ref_name }}"
          mkdir -p dist

          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > my-upload-key.jks
            export KEYSTORE_PATH="$PWD/my-upload-key.jks"
            gradle :app:assembleRelease :app:bundleRelease --no-configuration-cache --console=plain
            cp app/build/outputs/apk/release/app-release.apk "dist/Billuminati-${RELEASE_TAG}.apk"
            cp app/build/outputs/bundle/release/app-release.aab "dist/Billuminati-${RELEASE_TAG}.aab"
            echo "BUILD_VARIANT=release" >> "$GITHUB_ENV"
          else
            gradle :app:assembleDebug --no-configuration-cache --console=plain
            cp app/build/outputs/apk/debug/app-debug.apk "dist/Billuminati-${RELEASE_TAG}.apk"
            echo "BUILD_VARIANT=debug" >> "$GITHUB_ENV"
          fi

          (cd dist && sha256sum * > SHA256SUMS.txt)
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          ls -lh dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Billuminati ${{ env.RELEASE_TAG }}"
          generate_release_notes: true
          make_latest: true
          files: |
            dist/*
